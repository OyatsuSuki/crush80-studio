name: Build, Test & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain & clippy
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crush80-studio-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crush80-studio-rs/Cargo.lock') }}

      - name: Run Rust unit tests
        working-directory: crush80-studio-rs
        run: cargo test --locked

      - name: Run Clippy lints
        working-directory: crush80-studio-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Syntax-check Python tooling
        shell: pwsh
        run: python -m py_compile build_pro_firmware.py embed_icon.py via_backup.py flash_win.py

      - name: Build Crush 80 Studio (Release)
        working-directory: crush80-studio-rs
        run: cargo build --locked --release

      - name: Stage executable, embed Windows icon & compute SHA-256
        shell: pwsh
        run: |
          Copy-Item -Force crush80-studio-rs\target\release\crush80-studio.exe Crush80_Studio.exe
          python -m pip install --quiet pillow==11.2.1
          python embed_icon.py
          $hash = (Get-FileHash -Algorithm SHA256 Crush80_Studio.exe).Hash.ToLower()
          "$hash  Crush80_Studio.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Crush80_Studio-windows-x64
          path: |
            Crush80_Studio.exe
            SHA256SUMS.txt

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Crush80_Studio-windows-x64

      - name: Publish to GitHub Release on tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Crush80_Studio.exe
            SHA256SUMS.txt
          generate_release_notes: true
